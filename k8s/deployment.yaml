apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rag-api-deployment
  labels:
    app: ai-rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-rag-api
  template:
    metadata:
      labels:
        app: ai-rag-api
    spec:
      containers:
        - name: rag-api
          image: ai-rag-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_HOST
              value: "qdrant-service"
            - name: QDRANT_PORT
              value: "6333"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-rag-api-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ai-rag-api

name: ai-rag-platform

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_rag_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rag-net

  rag-redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rag-net

  rag-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    environment:
      PORT: "8000"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: rag-redis
      REDIS_PORT: "6379"
    ports:
      - "8083:8000"
    depends_on:
      rag-redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - rag-net

volumes:
  qdrant_rag_data:

networks:
  rag-net:
    driver: bridge
